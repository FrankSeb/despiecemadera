<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despiece de madera</title>
<style>
:root{--bg:#e9eeec;--panel:#f7f9f8;--ink:#16302b;--mute:#5a6e69;--line:#b9c6c1;--pencil:#e8b923;--wood:#d8be94;--woodline:#8a6b3f;--bad:#a63a2b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121c1a;--panel:#1b2927;--ink:#e6eeeb;--mute:#93a8a2;--line:#33473f;--wood:#5d4a2f;--woodline:#b8955a;--bad:#e5806f}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Bahnschrift,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{padding:28px 24px 8px;max-width:1280px;margin:0 auto}
h1{font-size:2rem;margin:0;letter-spacing:-.01em;font-weight:700;border-bottom:4px solid var(--pencil);display:inline-block;padding-bottom:2px}
header p{margin:8px 0 0;color:var(--mute);max-width:60ch}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:16px 24px 48px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
h2{font-size:1.05rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute)}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--pencil);outline-offset:1px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem;margin-bottom:16px}
.check input{width:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.8rem;font-weight:600;color:var(--mute);text-align:left;padding:0 4px 4px}
td{padding:3px 4px}
td input{padding:5px 6px}
.pieces td:nth-child(1){width:34%}
.pieces td:nth-child(5){width:34px}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;padding:7px 12px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.del{padding:4px 8px;border-color:transparent;background:transparent;color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{border-left:4px solid var(--pencil);padding:2px 10px}
.stat b{display:block;font-size:1.7rem;line-height:1.15}
.stat span{font-size:.85rem;color:var(--mute)}
.board{margin:0 0 20px}
.board h3{font-size:.95rem;margin:0 0 6px}
svg{width:100%;height:auto;display:block;background:var(--wood);border:2px solid var(--woodline)}
svg text{font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;fill:#1b1b1b;pointer-events:none}
.warn{border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:8px 12px;margin-bottom:16px}
.bom td,.bom th{padding:6px 8px;border-bottom:1px solid var(--line)}
.bom td.n,.bom th.n{text-align:right;font-variant-numeric:tabular-nums}
.bom tfoot td{font-weight:700;border-bottom:0}
.empty{color:var(--mute)}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #0006;margin-right:6px;vertical-align:-1px}
@media print{form#cfg,.actions,header p{display:none}main{display:block;padding:0}section{border:0;padding:0}.board{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>Despiece de madera</h1>
  <p>Introduce las piezas de tu proyecto y obtén el plano de corte y la lista de despiece. Medidas en milímetros.</p>
</header>
<main>
  <section id="cfg">
    <h2>Tablero y piezas</h2>
    <div class="row3">
      <label>Largo<input id="bl" type="number" min="1" inputmode="numeric"></label>
      <label>Ancho<input id="bw" type="number" min="1" inputmode="numeric"></label>
      <label>Corte de sierra<input id="bk" type="number" min="0" step="0.5" inputmode="decimal"></label>
    </div>
    <label class="check"><input id="rot" type="checkbox"> Permitir girar piezas (material sin veta)</label>
    <table class="pieces">
      <thead><tr><th>Nombre</th><th>Largo</th><th>Ancho</th><th>Cant.</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="actions">
      <button type="button" id="add">Agregar pieza</button>
      <button type="button" class="ghost" id="demo">Cargar ejemplo</button>
      <button type="button" class="ghost" id="clear">Vaciar lista</button>
    </div>
  </section>

  <section id="out" aria-live="polite"></section>
</main>

<script>
(function(){
'use strict';
var KEY='despiecemadera.v1';
var DEMO=[
  {n:'Lateral',l:720,w:560,q:2},{n:'Base',l:764,w:560,q:1},{n:'Estante',l:764,w:520,q:2},
  {n:'Puerta',l:716,w:398,q:2},{n:'Travesaño',l:764,w:100,q:2},{n:'Fondo',l:764,w:716,q:1}
];
var S={L:2440,W:1220,k:3,rot:false,p:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.p))S=Object.assign(S,o);}}catch(e){}
if(!S.p.length)S.p=DEMO.map(function(x){return Object.assign({},x)});

var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hue(i){return 'hsl('+((i*67)%360)+' 55% 68%)'}
function fmt(n){return n.toLocaleString('es-ES',{maximumFractionDigits:1})}

/* ---------- Empaquetado (MaxRects, mejor ajuste por lado corto) ---------- */
function inside(a,b){return a.x>=b.x&&a.y>=b.y&&a.x+a.w<=b.x+b.w&&a.y+a.h<=b.y+b.h}
function splitFree(free,r){
  var out=[];
  free.forEach(function(f){
    if(r.x>=f.x+f.w||r.x+r.w<=f.x||r.y>=f.y+f.h||r.y+r.h<=f.y){out.push(f);return}
    if(r.x>f.x)out.push({x:f.x,y:f.y,w:r.x-f.x,h:f.h});
    if(r.x+r.w<f.x+f.w)out.push({x:r.x+r.w,y:f.y,w:f.x+f.w-r.x-r.w,h:f.h});
    if(r.y>f.y)out.push({x:f.x,y:f.y,w:f.w,h:r.y-f.y});
    if(r.y+r.h<f.y+f.h)out.push({x:f.x,y:r.y+r.h,w:f.w,h:f.y+f.h-r.y-r.h});
  });
  return out.filter(function(a,i){
    return !out.some(function(b,j){return i!==j&&inside(a,b)&&(!inside(b,a)||j<i)});
  });
}
function findSpot(board,it,k){
  var best=null;
  board.free.forEach(function(f){
    (S.rot?[false,true]:[false]).forEach(function(rot){
      var pw=(rot?it.w:it.l)+k,ph=(rot?it.l:it.w)+k;
      if(pw<=f.w&&ph<=f.h){
        var s1=Math.min(f.w-pw,f.h-ph),s2=Math.max(f.w-pw,f.h-ph);
        if(!best||s1<best.s1||(s1===best.s1&&s2<best.s2))best={x:f.x,y:f.y,pw:pw,ph:ph,s1:s1,s2:s2,rot:rot};
      }
    });
  });
  return best;
}
function compute(){
  var L=S.L,W=S.W,k=Math.max(0,S.k),items=[],bad=[];
  S.p.forEach(function(p,i){
    var l=+p.l,w=+p.w,q=Math.floor(+p.q);
    if(!(l>0&&w>0&&q>0))return;
    var fits=(l<=L&&w<=W)||(S.rot&&w<=L&&l<=W);
    if(!fits){bad.push(p.n||('Pieza '+(i+1)));return}
    for(var n=0;n<q;n++)items.push({n:p.n||('Pieza '+(i+1)),l:l,w:w,i:i});
  });
  items.sort(function(a,b){return b.l*b.w-a.l*a.w});
  var boards=[];
  items.forEach(function(it){
    var spot=null,b=null;
    for(var j=0;j<boards.length&&!spot;j++){spot=findSpot(boards[j],it,k);if(spot)b=boards[j]}
    if(!spot){b={free:[{x:0,y:0,w:L+k,h:W+k}],placed:[]};boards.push(b);spot=findSpot(b,it,k)}
    b.placed.push({x:spot.x,y:spot.y,w:spot.pw-k,h:spot.ph-k,it:it,rot:spot.rot});
    b.free=splitFree(b.free,{x:spot.x,y:spot.y,w:spot.pw,h:spot.ph});
  });
  var used=items.reduce(function(a,it){return a+it.l*it.w},0);
  return{boards:boards,items:items,bad:bad,used:used,total:boards.length*L*W};
}

/* ---------- Dibujo ---------- */
function boardSVG(b,idx){
  var L=S.L,W=S.W,fs=Math.max(L,W)/60,g='';
  b.placed.forEach(function(r){
    g+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" fill="'+hue(r.it.i)+'" stroke="#2a2a2a" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
    if(r.w>fs*5&&r.h>fs*2.2){
      g+='<text x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2-(r.h>fs*3.6?fs*.2:-fs*.35))+'" font-size="'+fs+'" text-anchor="middle" font-weight="600">'+esc(r.it.n)+'</text>';
      if(r.h>fs*3.6)g+='<text x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2+fs*1.1)+'" font-size="'+fs*.85+'" text-anchor="middle">'+fmt(r.w)+' × '+fmt(r.h)+'</text>';
    }
  });
  return '<figure class="board"><h3>Tablero '+(idx+1)+' · '+fmt(S.L)+' × '+fmt(S.W)+' mm</h3><svg viewBox="0 0 '+L+' '+W+'" role="img" aria-label="Plano de corte del tablero '+(idx+1)+'">'+g+'</svg></figure>';
}
function bomRows(){
  return S.p.map(function(p,i){return{i:i,n:p.n||('Pieza '+(i+1)),l:+p.l,w:+p.w,q:Math.floor(+p.q)}})
    .filter(function(r){return r.l>0&&r.w>0&&r.q>0});
}
function render(){
  var r=compute(),bom=bomRows(),h='';
  if(!bom.length){$('#out').innerHTML='<p class="empty">Agrega al menos una pieza con largo, ancho y cantidad para ver el plano de corte.</p>';return}
  if(r.bad.length)h+='<div class="warn">No caben en el tablero: '+r.bad.map(esc).join(', ')+'. Revisa sus medidas o el tamaño del tablero.</div>';
  var pct=r.total?r.used/r.total*100:0;
  h+='<div class="stats"><div class="stat"><b>'+r.boards.length+'</b><span>tableros necesarios</span></div>'+
     '<div class="stat"><b>'+fmt(pct)+' %</b><span>aprovechamiento</span></div>'+
     '<div class="stat"><b>'+fmt((r.total-r.used)/1e6)+' m²</b><span>sobrante</span></div>'+
     '<div class="stat"><b>'+r.items.length+'</b><span>piezas colocadas</span></div></div>';
  r.boards.forEach(function(b,i){h+=boardSVG(b,i)});
  h+='<h2>Despiece</h2><div style="overflow-x:auto"><table class="bom"><thead><tr><th>Pieza</th><th class="n">Largo</th><th class="n">Ancho</th><th class="n">Cant.</th><th class="n">Área (m²)</th></tr></thead><tbody>';
  var tq=0,ta=0;
  bom.forEach(function(x){var a=x.l*x.w*x.q/1e6;tq+=x.q;ta+=a;
    h+='<tr><td><span class="sw" style="background:'+hue(x.i)+'"></span>'+esc(x.n)+'</td><td class="n">'+fmt(x.l)+'</td><td class="n">'+fmt(x.w)+'</td><td class="n">'+x.q+'</td><td class="n">'+a.toFixed(3)+'</td></tr>'});
  h+='</tbody><tfoot><tr><td>Total</td><td></td><td></td><td class="n">'+tq+'</td><td class="n">'+ta.toFixed(3)+'</td></tr></tfoot></table></div>';
  h+='<div class="actions"><button type="button" id="csv">Exportar CSV</button><button type="button" class="ghost" id="print">Imprimir planos</button></div>';
  $('#out').innerHTML=h;
  $('#csv').onclick=exportCSV;$('#print').onclick=function(){window.print()};
}
function exportCSV(){
  var lines=['Pieza;Largo (mm);Ancho (mm);Cantidad;Area (m2)'];
  bomRows().forEach(function(x){lines.push([x.n.replace(/;/g,','),x.l,x.w,x.q,(x.l*x.w*x.q/1e6).toFixed(3)].join(';'))});
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='despiece.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}

/* ---------- Formulario ---------- */
function rows(){
  $('#rows').innerHTML=S.p.map(function(p,i){
    return '<tr data-i="'+i+'"><td><input data-f="n" value="'+esc(p.n)+'" aria-label="Nombre"></td>'+
      '<td><input data-f="l" type="number" min="1" inputmode="numeric" value="'+esc(p.l)+'" aria-label="Largo"></td>'+
      '<td><input data-f="w" type="number" min="1" inputmode="numeric" value="'+esc(p.w)+'" aria-label="Ancho"></td>'+
      '<td><input data-f="q" type="number" min="1" inputmode="numeric" value="'+esc(p.q)+'" aria-label="Cantidad"></td>'+
      '<td><button type="button" class="del" data-del aria-label="Quitar pieza">✕</button></td></tr>';
  }).join('');
}
function cfg(){$('#bl').value=S.L;$('#bw').value=S.W;$('#bk').value=S.k;$('#rot').checked=S.rot}
function update(){save();render()}
$('#rows').addEventListener('input',function(e){
  var f=e.target.dataset.f,tr=e.target.closest('tr');if(!f||!tr)return;
  S.p[+tr.dataset.i][f]=f==='n'?e.target.value:e.target.value;update();
});
$('#rows').addEventListener('click',function(e){
  if(!e.target.hasAttribute('data-del'))return;
  S.p.splice(+e.target.closest('tr').dataset.i,1);rows();update();
});
$('#bl').oninput=function(){S.L=+this.value||1;update()};
$('#bw').oninput=function(){S.W=+this.value||1;update()};
$('#bk').oninput=function(){S.k=+this.value||0;update()};
$('#rot').onchange=function(){S.rot=this.checked;update()};
$('#add').onclick=function(){S.p.push({n:'',l:'',w:'',q:1});rows();update();var t=$('#rows tr:last-child input');if(t)t.focus()};
$('#demo').onclick=function(){S.p=DEMO.map(function(x){return Object.assign({},x)});rows();update()};
$('#clear').onclick=function(){S.p=[];rows();update()};
cfg();rows();render();
})();
</script>
</body>
</html>
