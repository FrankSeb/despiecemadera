name: Deploy Supabase photo agent

on:
  push:
    branches: [main]
    paths:
      - 'despiecemadera/supabase/**'
      - '.github/workflows/deploy-supabase-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "GEMINI_API_KEY is missing from GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy photo analysis function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: ./despiecemadera
        run: supabase functions deploy analyze-furniture --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
