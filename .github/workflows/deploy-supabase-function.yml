name: Deploy Supabase photo agent

on:
  push:
    branches: [main]
    paths:
      - 'despiecemadera/supabase/**'
      - '.github/workflows/deploy-supabase-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_PROJECT_REF to GitHub Actions variables."
            exit 1
          fi
      - name: Deploy photo analysis function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: ./despiecemadera
        run: supabase functions deploy analyze-furniture --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
